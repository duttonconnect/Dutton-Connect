workflows:
  ios-release:
    name: Dutton Connect — iOS Release
    max_build_duration: 60
    environment:
      node: v24
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.duttonconnect.app
        XCODE_WORKSPACE: artifacts/dutton-toolkit/ios/App/App.xcworkspace
        XCODE_SCHEME: App
        # Your 10-character Apple Team ID — find it at:
        # developer.apple.com/account → Membership → Team ID
        APPLE_TEAM_ID: XZ68HMHPP4
      groups:
        - apple_credentials
      # Firebase config is required at build time so Vite can embed it.
      # Add these as individual environment variables in the Codemagic UI:
      #   VITE_FIREBASE_API_KEY
      #   VITE_FIREBASE_AUTH_DOMAIN
      #   VITE_FIREBASE_PROJECT_ID
      #   VITE_FIREBASE_STORAGE_BUCKET
      #   VITE_FIREBASE_MESSAGING_SENDER_ID
      #   VITE_FIREBASE_APP_ID
    scripts:
      - name: Install pnpm
        script: |
          corepack disable || true
          which pnpm || npm install -g pnpm@latest

      - name: Install workspace dependencies
        script: |
          # firebase-tools is a dev tool not needed for iOS builds — remove it to avoid
          # ERR_PNPM_MISSING_TIME errors caused by its dependency chain in pnpm v10
          node -e "
            const fs = require('fs');
            const p = 'artifacts/dutton-toolkit/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete pkg.devDependencies['firebase-tools'];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            console.log('Removed firebase-tools from devDependencies');
          "
          # Allow all build scripts in CI (pnpm v10 requires explicit approval)
          printf "\ndangerouslyAllowAllBuilds: true\n" >> pnpm-workspace.yaml
          COREPACK_ENABLE_STRICT=0 pnpm install --no-frozen-lockfile

      - name: Build web app for Capacitor
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:build

      - name: Sync web build into iOS project
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:sync

      - name: Install CocoaPods dependencies
        script: |
          pod install
        working_directory: artifacts/dutton-toolkit/ios/App

      - name: Set up code signing
        script: |
          echo "=== Listing existing Distribution certs in portal ==="
          app-store-connect list-certificates --type IOS_DISTRIBUTION || true

          echo "=== Creating Distribution certificate if needed ==="
          app-store-connect create-certificate --type IOS_DISTRIBUTION || \
            echo "Certificate may already exist — continuing"

          echo "=== Fetching App Store signing files ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --verbose

          echo "=== Downloaded provisioning profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "NONE"
          echo "=== Downloaded certificates ==="
          ls ~/Library/MobileDevice/Certificates/ 2>/dev/null || echo "NONE"

          keychain initialize
          keychain add-certificates

          PROVISIONING_PROFILE_UUID=$(python3 scripts/extract-profile-uuid.py)
          echo "=== Profile UUID: $PROVISIONING_PROFILE_UUID ==="
          PROVISIONING_PROFILE_UUID="$PROVISIONING_PROFILE_UUID" python3 scripts/patch-xcode-signing.py

      - name: Build IPA
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath /tmp/ipa-output \
            -exportOptionsPlist artifacts/dutton-toolkit/ios/ExportOptions.plist

    artifacts:
      - /tmp/ipa-output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
