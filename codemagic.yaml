
workflows:
  ios-release:
    name: Dutton Connect — iOS Release
    max_build_duration: 60
    environment:
      node: v24
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.duttonconnect.app
        XCODE_WORKSPACE: artifacts/dutton-toolkit/ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APPLE_TEAM_ID: XZ68HMHPP4
        VITE_FIREBASE_API_KEY: AIzaSyDRY-_9BcDkToYif6xtvgavT_RhxsFN2oc
        VITE_FIREBASE_AUTH_DOMAIN: dutton-connect.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: dutton-connect
        VITE_FIREBASE_STORAGE_BUCKET: dutton-connect.appspot.com
        VITE_FIREBASE_MESSAGING_SENDER_ID: "466844599639"
        VITE_FIREBASE_APP_ID: "1:466844599639:web:f412c0053b2a0c54036a12"
      groups:
        - apple_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.duttonconnect.app

    scripts:
      - name: Install pnpm
        script: |
          corepack disable || true
          npm install -g pnpm@10.26.1
          pnpm --version

      - name: Install workspace dependencies
        script: |
          node -e "
            const fs = require('fs');
            const p = 'artifacts/dutton-toolkit/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (pkg.devDependencies) delete pkg.devDependencies['firebase-tools'];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            console.log('Removed firebase-tools from devDependencies if present');
          "
          # Retain the workspace's approved build scripts and package-age policy.
          COREPACK_ENABLE_STRICT=0 pnpm install --no-frozen-lockfile

      - name: Set build number from Codemagic run counter
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" \
            artifacts/dutton-toolkit/ios/App/App.xcodeproj/project.pbxproj
          echo "=== Build number set to $BUILD_NUMBER ==="
          grep "CURRENT_PROJECT_VERSION" artifacts/dutton-toolkit/ios/App/App.xcodeproj/project.pbxproj

      - name: Build web app for Capacitor
        script: |
          set -euo pipefail
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!key:-}" ]; then
              echo "ERROR: Missing required Firebase build variable: $key"
              exit 1
            fi
          done
          pnpm --filter @workspace/dutton-toolkit run cap:build
          node artifacts/dutton-toolkit/scripts/verify-ios-web-assets.mjs artifacts/dutton-toolkit/dist/public

      - name: Sync web build into iOS project
        script: |
          set -euo pipefail
          pnpm --filter @workspace/dutton-toolkit run cap:sync
          node artifacts/dutton-toolkit/scripts/verify-ios-web-assets.mjs artifacts/dutton-toolkit/ios/App/App/public
          test -s artifacts/dutton-toolkit/ios/App/App/capacitor.config.json

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/dutton-toolkit/ios/App
          pod install

      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning || true

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/ipa-output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
