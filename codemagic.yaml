workflows:
  ios-release:
    name: Dutton Connect — iOS Release
    max_build_duration: 60
    environment:
      node: v24
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.duttonconnect.app
        XCODE_WORKSPACE: artifacts/dutton-toolkit/ios/App/App.xcworkspace
        XCODE_SCHEME: App
        # Your 10-character Apple Team ID — find it at:
        # developer.apple.com/account → Membership → Team ID
        APPLE_TEAM_ID: XZ68HMHPP4
        # Firebase client config — these are NOT secrets.
        # Firebase security comes from Firestore Rules, not from hiding these values.
        # See: firebase.google.com/docs/projects/api-keys
        VITE_FIREBASE_API_KEY: AIzaSyDRY-_9BcDkToYif6xtvgavT_RhxsFN2oc
        VITE_FIREBASE_AUTH_DOMAIN: dutton-connect.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: dutton-connect
        VITE_FIREBASE_STORAGE_BUCKET: dutton-connect.appspot.com
        VITE_FIREBASE_MESSAGING_SENDER_ID: "466844599639"
        VITE_FIREBASE_APP_ID: "1:466844599639:web:f412c0053b2a0c54036a12"
      groups:
        - apple_credentials
    scripts:
      - name: Install pnpm
        script: |
          corepack disable || true
          which pnpm || npm install -g pnpm@latest

      - name: Install workspace dependencies
        script: |
          # firebase-tools is a dev tool not needed for iOS builds — remove it to avoid
          # ERR_PNPM_MISSING_TIME errors caused by its dependency chain in pnpm v10
          node -e "
            const fs = require('fs');
            const p = 'artifacts/dutton-toolkit/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete pkg.devDependencies['firebase-tools'];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            console.log('Removed firebase-tools from devDependencies');
          "
          # Allow all build scripts in CI (pnpm v10 requires explicit approval)
          printf "\ndangerouslyAllowAllBuilds: true\n" >> pnpm-workspace.yaml
          COREPACK_ENABLE_STRICT=0 pnpm install --no-frozen-lockfile \
            --config.resolution-mode=highest \
            --config.minimum-release-age=0

      - name: Build web app for Capacitor
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:build

      - name: Sync web build into iOS project
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:sync

      - name: Install CocoaPods dependencies
        script: |
          pod install
        working_directory: artifacts/dutton-toolkit/ios/App

      - name: Set up code signing
        script: |
          set -e  # fail fast — if any step below fails, stop immediately

          # Step 1 — Ensure our iOS Distribution certificate exists.
          # If Apple's limit is already reached this will fail — that is fine,
          # the existing cert will be used in Step 2.
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" 2>/dev/null \
            && echo "=== Certificate created ===" \
            || echo "=== Certificate already exists — continuing ==="

          # Step 2 — Wipe any stale profiles from previous builds, then let
          # fetch-signing-files handle cert+profile matching automatically.
          # --create: creates an App Store profile if none exists for this bundle.
          # This is the idiomatic Codemagic approach; it guarantees the profile
          # it downloads was built for the cert that matches CERTIFICATE_PRIVATE_KEY.
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null || true
          echo "=== Cleared old profiles from disk ==="

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create

          echo "=== Downloaded provisioning profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "NONE"

          keychain initialize
          keychain add-certificates

          echo "=== All codesigning identities ==="
          security find-identity -v -p codesigning || true

          # Step 3 — Patch the Xcode project and write ExportOptions.plist.
          PROVISIONING_PROFILE_UUID=$(python3 scripts/extract-profile-uuid.py)
          echo "=== Profile UUID: $PROVISIONING_PROFILE_UUID ==="
          PROVISIONING_PROFILE_UUID="$PROVISIONING_PROFILE_UUID" python3 scripts/patch-xcode-signing.py

          # Rewrite ExportOptions.plist with the actual profile UUID so the
          # export step can locate it — hardcoded profile names don't work.
          python3 -c "import plistlib,os;u=os.environ['PROVISIONING_PROFILE_UUID'];p={'method':'app-store-connect','teamID':'XZ68HMHPP4','signingStyle':'manual','signingCertificate':'iPhone Distribution','provisioningProfiles':{'com.duttonconnect.app':u},'uploadBitcode':False,'uploadSymbols':True};plistlib.dump(p,open('artifacts/dutton-toolkit/ios/ExportOptions.plist','wb'));print('ExportOptions.plist written with UUID:',u)" PROVISIONING_PROFILE_UUID="$PROVISIONING_PROFILE_UUID"

      - name: Build IPA
        script: |
          # Use the SHA1 fingerprint of our newly installed cert — unambiguous, can't
          # accidentally pick the old stale cert that has no private key here.
          KEYCHAIN=$(ls ~/Library/codemagic-cli-tools/keychains/*.keychain-db 2>/dev/null | head -1)
          CERT_SHA1=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -E "iPhone Distribution|Apple Distribution" \
            | awk '{print $2}' | head -1)
          echo "=== Signing with SHA1: $CERT_SHA1 ==="

          xcodebuild \
           -workspace "$XCODE_WORKSPACE" \
           -scheme "$XCODE_SCHEME" \
           -sdk iphoneos \
           -configuration Release \
           -archivePath /tmp/App.xcarchive \
           archive \
          CODE_SIGN_IDENTITY="Apple Distribution"
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath /tmp/ipa-output \
            -exportOptionsPlist artifacts/dutton-toolkit/ios/ExportOptions.plist

    artifacts:
      - /tmp/ipa-output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
