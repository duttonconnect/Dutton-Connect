workflows:
  ios-release:
    name: Dutton Connect — iOS Release
    max_build_duration: 60
    environment:
      node: v24
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.duttonconnect.app
        XCODE_WORKSPACE: artifacts/dutton-toolkit/ios/App/App.xcworkspace
        XCODE_SCHEME: App
        # Your 10-character Apple Team ID — find it at:
        # developer.apple.com/account → Membership → Team ID
        APPLE_TEAM_ID: XZ68HMHPP4
      groups:
        - apple_credentials
      # Firebase config is required at build time so Vite can embed it.
      # Add these as individual environment variables in the Codemagic UI:
      #   VITE_FIREBASE_API_KEY
      #   VITE_FIREBASE_AUTH_DOMAIN
      #   VITE_FIREBASE_PROJECT_ID
      #   VITE_FIREBASE_STORAGE_BUCKET
      #   VITE_FIREBASE_MESSAGING_SENDER_ID
      #   VITE_FIREBASE_APP_ID
    scripts:
      - name: Install pnpm
        script: |
          corepack disable || true
          which pnpm || npm install -g pnpm@latest

      - name: Install workspace dependencies
        script: |
          # firebase-tools is a dev tool not needed for iOS builds — remove it to avoid
          # ERR_PNPM_MISSING_TIME errors caused by its dependency chain in pnpm v10
          node -e "
            const fs = require('fs');
            const p = 'artifacts/dutton-toolkit/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete pkg.devDependencies['firebase-tools'];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            console.log('Removed firebase-tools from devDependencies');
          "
          # Allow all build scripts in CI (pnpm v10 requires explicit approval)
          printf "\ndangerouslyAllowAllBuilds: true\n" >> pnpm-workspace.yaml
          COREPACK_ENABLE_STRICT=0 pnpm install --no-frozen-lockfile \
            --config.resolution-mode=highest \
            --config.minimum-release-age=0

      - name: Build web app for Capacitor
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:build

      - name: Sync web build into iOS project
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:sync

      - name: Install CocoaPods dependencies
        script: |
          pod install
        working_directory: artifacts/dutton-toolkit/ios/App

      - name: Set up code signing
        script: |
          # CERTIFICATE_PRIVATE_KEY must be set in the apple_credentials env group.
          # Generate once with: openssl genrsa 2048
          # Then paste the full output into Codemagic as a secure env var.

          # Step 1 — Create (or reuse) our iOS Distribution certificate.
          # Capture the JSON output so we can extract the cert ID directly.
          NEW_CERT_JSON=$(app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --json 2>/dev/null || echo '{}')
          NEW_CERT_ID=$(echo "$NEW_CERT_JSON" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('data',{}).get('id',''))" 2>/dev/null || echo "")
          echo "=== Newly created cert ID: $NEW_CERT_ID ==="

          # Step 2 — Collect every distribution cert ID for this team, then
          # add the newly created cert ID to guarantee it is present even if
          # the API list has not yet reflected the create above.
          ALL_CERT_IDS=$(app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --json 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);ids=[c['id'] for c in d.get('data',[])];sys.stderr.write('Cert IDs: '+str(ids)+'\n');print(' '.join(ids))")
          # Merge: add newly created ID if not already in the list
          if [ -n "$NEW_CERT_ID" ]; then
            ALL_CERT_IDS=$(echo "$ALL_CERT_IDS $NEW_CERT_ID" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
          fi
          echo "=== All distribution cert IDs: $ALL_CERT_IDS ==="

          # Step 3 — Delete any existing App Store profile for this bundle ID,
          # then recreate it so it includes every distribution cert.
          PROFILE_IDS=$(app-store-connect profiles list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --json 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print(' '.join(p['id'] for p in d.get('data',[])))")
          echo "=== Existing profile IDs: $PROFILE_IDS ==="
          for PID in $PROFILE_IDS; do
            echo "=== Deleting profile $PID ==="
            app-store-connect profiles delete "$PID" 2>/dev/null || true
          done

          echo "=== Creating profile with all certs: $ALL_CERT_IDS ==="
          app-store-connect profiles create \
            --name "Dutton Connect ios_app_store" \
            --type IOS_APP_STORE \
            --bundle-id-identifier "$BUNDLE_ID" \
            --certificate-id $ALL_CERT_IDS

          # Step 4 — Download the freshly created profile and our cert.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"

          echo "=== Downloaded provisioning profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "NONE"

          keychain initialize
          keychain add-certificates

          echo "=== All codesigning identities ==="
          security find-identity -v -p codesigning || true

          PROVISIONING_PROFILE_UUID=$(python3 scripts/extract-profile-uuid.py)
          echo "=== Profile UUID: $PROVISIONING_PROFILE_UUID ==="
          PROVISIONING_PROFILE_UUID="$PROVISIONING_PROFILE_UUID" python3 scripts/patch-xcode-signing.py

      - name: Build IPA
        script: |
          # Use the SHA1 fingerprint of our newly installed cert — unambiguous, can't
          # accidentally pick the old stale cert that has no private key here.
          KEYCHAIN=$(ls ~/Library/codemagic-cli-tools/keychains/*.keychain-db 2>/dev/null | head -1)
          CERT_SHA1=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -E "iPhone Distribution|Apple Distribution" \
            | awk '{print $2}' | head -1)
          echo "=== Signing with SHA1: $CERT_SHA1 ==="

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="$CERT_SHA1"
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath /tmp/ipa-output \
            -exportOptionsPlist artifacts/dutton-toolkit/ios/ExportOptions.plist

    artifacts:
      - /tmp/ipa-output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
