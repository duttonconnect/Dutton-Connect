workflows:
  ios-release:
    name: Dutton Connect — iOS Release
    max_build_duration: 60
    environment:
      node: v24
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.duttonconnect.app
        XCODE_WORKSPACE: artifacts/dutton-toolkit/ios/App/App.xcworkspace
        XCODE_SCHEME: App
        # Your 10-character Apple Team ID — find it at:
        # developer.apple.com/account → Membership → Team ID
        APPLE_TEAM_ID: XZ68HMHPP4
      groups:
        - apple_credentials
      # Firebase config is required at build time so Vite can embed it.
      # Add these as individual environment variables in the Codemagic UI:
      #   VITE_FIREBASE_API_KEY
      #   VITE_FIREBASE_AUTH_DOMAIN
      #   VITE_FIREBASE_PROJECT_ID
      #   VITE_FIREBASE_STORAGE_BUCKET
      #   VITE_FIREBASE_MESSAGING_SENDER_ID
      #   VITE_FIREBASE_APP_ID
    scripts:
      - name: Install pnpm
        script: |
          corepack disable || true
          which pnpm || npm install -g pnpm@latest

      - name: Install workspace dependencies
        script: |
          # Allow all build scripts in CI (pnpm v10 requires explicit approval)
          printf "\ndangerouslyAllowAllBuilds: true\n" >> pnpm-workspace.yaml
          COREPACK_ENABLE_STRICT=0 pnpm install --no-frozen-lockfile --config.resolution-mode=highest

      - name: Build web app for Capacitor
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:build

      - name: Sync web build into iOS project
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:sync

      - name: Install CocoaPods dependencies
        script: |
          pod install
        working_directory: artifacts/dutton-toolkit/ios/App

      - name: Set up code signing
        script: |
          python3 - <<'PYEOF'
import os
pbxproj = "artifacts/dutton-toolkit/ios/App/App.xcodeproj/project.pbxproj"
team_id = os.environ["APPLE_TEAM_ID"]
with open(pbxproj) as f:
    content = f.read()
content = content.replace("CODE_SIGN_STYLE = Automatic", "CODE_SIGN_STYLE = Manual")
content = content.replace(
    "PRODUCT_BUNDLE_IDENTIFIER = com.duttonconnect.app;",
    "PRODUCT_BUNDLE_IDENTIFIER = com.duttonconnect.app;\n\t\t\t\tDEVELOPMENT_TEAM = " + team_id + ";"
)
with open(pbxproj, "w") as f:
    f.write(content)
print("Patched Xcode project with team ID:", team_id)
PYEOF
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - artifacts/dutton-toolkit/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
