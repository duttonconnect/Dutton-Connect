
workflows:
  ios-release:
    name: Dutton Connect — iOS Release
    max_build_duration: 60
    environment:
      node: v24
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.duttonconnect.app
        XCODE_WORKSPACE: artifacts/dutton-toolkit/ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APPLE_TEAM_ID: XZ68HMHPP4
        VITE_FIREBASE_API_KEY: AIzaSyDRY-_9BcDkToYif6xtvgavT_RhxsFN2oc
        VITE_FIREBASE_AUTH_DOMAIN: dutton-connect.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: dutton-connect
        VITE_FIREBASE_STORAGE_BUCKET: dutton-connect.appspot.com
        VITE_FIREBASE_MESSAGING_SENDER_ID: "466844599639"
        VITE_FIREBASE_APP_ID: "1:466844599639:web:f412c0053b2a0c54036a12"
      groups:
        - apple_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.duttonconnect.app

    scripts:
      - name: Install pnpm
        script: |
          corepack disable || true
          which pnpm || npm install -g pnpm@latest

      - name: Install workspace dependencies
        script: |
          node -e "
            const fs = require('fs');
            const p = 'artifacts/dutton-toolkit/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (pkg.devDependencies) delete pkg.devDependencies['firebase-tools'];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            console.log('Removed firebase-tools from devDependencies if present');
          "
          printf "\ndangerouslyAllowAllBuilds: true\n" >> pnpm-workspace.yaml
          COREPACK_ENABLE_STRICT=0 pnpm install --no-frozen-lockfile \
            --config.resolution-mode=highest \
            --config.minimum-release-age=0

      - name: Set build number from Codemagic run counter
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" \
            artifacts/dutton-toolkit/ios/App/App.xcodeproj/project.pbxproj
          echo "=== Build number set to $BUILD_NUMBER ==="
          grep "CURRENT_PROJECT_VERSION" artifacts/dutton-toolkit/ios/App/App.xcodeproj/project.pbxproj

      - name: Build web app for Capacitor
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:build

      - name: Sync web build into iOS project
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:sync

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/dutton-toolkit/ios/App
          pod install

      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning || true

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/ipa-output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
