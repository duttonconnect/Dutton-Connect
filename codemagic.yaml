workflows:
  ios-release:
    name: Dutton Connect — iOS Release
    max_build_duration: 60
    environment:
      node: v24
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.duttonconnect.app
        XCODE_WORKSPACE: artifacts/dutton-toolkit/ios/App/App.xcworkspace
        XCODE_SCHEME: App
      groups:
        - apple_credentials
      # Firebase config is required at build time so Vite can embed it.
      # Add these as individual environment variables in the Codemagic UI:
      #   VITE_FIREBASE_API_KEY
      #   VITE_FIREBASE_AUTH_DOMAIN
      #   VITE_FIREBASE_PROJECT_ID
      #   VITE_FIREBASE_STORAGE_BUCKET
      #   VITE_FIREBASE_MESSAGING_SENDER_ID
      #   VITE_FIREBASE_APP_ID
    scripts:
      - name: Install pnpm
        script: |
          npm install -g pnpm@latest

      - name: Install workspace dependencies
        script: |
          pnpm install

      - name: Build web app for Capacitor
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:build

      - name: Sync web build into iOS project
        script: |
          pnpm --filter @workspace/dutton-toolkit run cap:sync

      - name: Install CocoaPods dependencies
        script: |
          pod install
        working_directory: artifacts/dutton-toolkit/ios/App

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - artifacts/dutton-toolkit/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
      # Uncomment to submit to TestFlight automatically:
      # app_store_connect:
      #   api_key: $APP_STORE_CONNECT_PRIVATE_KEY
      #   key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
      #   issuer_id: $APP_STORE_CONNECT_ISSUER_ID
      #   submit_to_testflight: true
